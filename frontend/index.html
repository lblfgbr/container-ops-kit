    async function openScheduleResult(type,id){navigateAutomation(type==='quality'?'quality':'auto-ut');await loadNavigationPage();try{if(type==='quality'){qualityUi.job=await autoUtCall('/api/quality/jobs/'+id);qualityUi.kind=qualityUi.job.input.kinds[0];qualityUi.version='';qualityUi.search='';workspaceUi.issue='';pollQuality();}else{if(id)applyReportRun(await autoUtCall('/api/auto-ut/reports/'+id));await loadAutoUtTasks();workspaceUi.autoTab='tasks';}render(false);}catch(e){showToast(e.message);}}
    function bindSchedules(){
      document.querySelectorAll('[data-automation-nav]').forEach(el=>el.addEventListener('click',()=>{workspaceUi.selectedTaskId='';navigateAutomation(el.dataset.automationNav);}));
      document.querySelectorAll('[data-schedule-new]').forEach(el=>el.addEventListener('click',()=>newSchedule(el.dataset.scheduleNew)));
      document.querySelector('[data-schedule-refresh]')?.addEventListener('click',loadSchedules);
      document.querySelectorAll('[data-schedule-edit]').forEach(el=>el.addEventListener('click',()=>editSchedule(el.dataset.scheduleEdit)));
      for(const op of ['toggle','run'])document.querySelectorAll(`[data-schedule-${op}]`).forEach(el=>el.addEventListener('click',()=>scheduleOperation(el.getAttribute('data-schedule-'+op),op)));
      document.querySelectorAll('[data-schedule-delete]').forEach(el=>el.addEventListener('click',()=>qwOpen({type:'schedule-delete',id:el.dataset.scheduleDelete})));
      document.querySelector('[data-schedule-confirm-delete]')?.addEventListener('click',async()=>{const id=workspaceUi.drawer.id;qwClose(true);await scheduleOperation(id,'delete');});
      document.querySelectorAll('[data-schedule-runs]').forEach(el=>el.addEventListener('click',()=>openScheduleRuns(el.dataset.scheduleRuns)));
      document.querySelectorAll('[data-schedule-quality]').forEach(el=>el.addEventListener('click',()=>openScheduleResult('quality',el.dataset.scheduleQuality)));
      document.querySelectorAll('[data-schedule-report]').forEach(el=>el.addEventListener('click',()=>openScheduleResult('report',el.dataset.scheduleReport)));
      document.querySelector('[data-schedule-tasks]')?.addEventListener('click',()=>openScheduleResult('report'));
      for(const[id,key]of [['schedule-query','query'],['schedule-kind','kind'],['schedule-status','status']])document.getElementById(id)?.addEventListener(key==='query'?'input':'change',e=>{schedulerUi[key]=e.target.value;render(false);});
      document.querySelectorAll('[data-sched-field]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft[el.dataset.schedField]=el.type==='checkbox'?el.checked:el.value));
      document.querySelectorAll('[data-sched-time]').forEach(el=>el.addEventListener('change',()=>{schedulerUi.draft.timing[el.dataset.schedTime]=el.dataset.schedTime==='weekday'?Number(el.value):el.value;if(el.dataset.schedTime==='frequency')document.getElementById('sched-weekday').hidden=el.value!=='weekly';}));
      document.getElementById('sched-tool')?.addEventListener('change',e=>{const old=schedulerUi.draft;newSchedule(e.target.value);schedulerUi.draft.timing=old.timing;schedulerUi.draft.enabled=old.enabled;if(!['每日质量检查','UT 治理计划'].includes(old.name))schedulerUi.draft.name=old.name;render(false);});
      document.querySelectorAll('[data-sched-quality]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.query[el.dataset.schedQuality]=el.dataset.schedQuality==='domain'?el.value:commaList(el.value)));
      document.querySelectorAll('[data-sched-kind]').forEach(el=>el.addEventListener('change',()=>schedulerUi.draft.task.query.kinds=[...document.querySelectorAll('[data-sched-kind]:checked')].map(x=>x.dataset.schedKind)));
      document.querySelectorAll('[data-sched-version]').forEach(el=>el.addEventListener('input',()=>{const v=schedulerUi.draft.task.config.versions[Number(el.dataset.schedVersion)];v.version=el.value.trim().toUpperCase();v.ticket='';delete v.dtsProduct;}));
      document.querySelectorAll('[data-sched-ticket]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.config.versions[Number(el.dataset.schedTicket)].ticket=el.value.trim()));
      document.querySelectorAll('[data-sched-branch]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.config.versions[Number(el.dataset.schedBranch)].baseBranch=el.value.trim()));
      document.querySelectorAll('[data-sched-config]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.config[el.dataset.schedConfig]=el.value.trim()));
      document.querySelector('[data-sched-retention]')?.addEventListener('input',e=>schedulerUi.draft.task.retentionDays=Number(e.target.value));
      document.querySelectorAll('[data-sched-remove]').forEach(el=>el.addEventListener('click',()=>{schedulerUi.draft.task.config.versions.splice(Number(el.dataset.schedRemove),1);render(false);}));
      document.querySelector('[data-sched-add]')?.addEventListener('click',()=>{schedulerUi.draft.task.config.versions.push({version:'',baseBranch:''});render(false);});
      document.getElementById('sched-action')?.addEventListener('change',e=>schedulerUi.draft.task.config.schedule.action=e.target.value);
      document.getElementById('sched-date')?.addEventListener('change',e=>{if(schedulerUi.draft.task.kind==='quality')schedulerUi.draft.task.dateMode=e.target.value;else schedulerUi.draft.task.config.dateMode=e.target.value;});
    }

    async function loadReviewData(){const request=++reviewUi.request;try{const [metrics,data]=await Promise.all([autoUtCall('/api/automation/effectiveness?days='+reviewUi.days),autoUtCall('/api/automation/knowledge')]);if(request!==reviewUi.request)return;if(!Array.isArray(data.items)||!Array.isArray(data.reviews)||typeof metrics.total!=='number')throw Error('统计暂不可用');reviewUi.metrics=metrics;reviewUi.items=data.items;reviewUi.reviews=data.reviews;reviewUi.error='';}catch(e){reviewUi.error=e.message;}if(state.platformDomain==='automation'&&['catalog','group-mr','knowledge'].includes(state.automationPage))render(false);}

    function reviewMetrics(){const m=reviewUi.metrics,rate=(n,d)=>d?(n/d*100).toFixed(1)+'%':'暂无数据';return `<div class="studio-section-head"><h2>提效指标</h2><div class="head-actions"><select id="review-period" aria-label="提效指标周期">${[7,30,90].map(n=>`<option value="${n}" ${reviewUi.days===n?'selected':''}>近 ${n} 天</option>`).join('')}</select><button class="qw-link" data-review-refresh>刷新</button></div></div>${reviewUi.error?`<p role="alert">${escapeHtml(reviewUi.error)}</p>`:''}<div class="review-metrics">${m?[
      ['最终合入率',rate(m.merged,m.total),`${m.merged} / ${m.total} 个 MR · ${m.pending} 个待处理`],['自动步骤异常率',rate(m.anomalies,m.total),`${m.anomalies} 个 MR 发生异常`],['人工审核等待',reviewDuration(m.waitMedianMs),`${m.reviews} 次审核 · 中位数`],['人工不通过率',rate(m.rejected,m.reviews),`${m.rejected} / ${m.reviews} 次审核`]
    ].map(([label,value,sub])=>`<div class="panel review-metric"><span>${label}</span><strong>${value}</strong><small>${sub}</small></div>`).join(''):reviewUi.error?'<p class="qw-muted">统计暂不可用，请刷新重试。</p>':'<p>正在加载统计…</p>'}</div>${m?`<details class="panel review-stat-detail" data-qw-open="overview-review-stat-detail"><summary>阶段耗时与统计口径</summary><p>按期间进入治理的 MR 去重；重试不重复计数。正常人工审核不算执行异常。等待时间不是人工工作时间。</p><p>自动化任务 ${m.tasks} 个 · 已记录人工操作 ${m.humanTouches} 次（审核、编译命令修改、远端结果核对；新增采集前的操作不回填）</p><p>人工等待平均 ${reviewDuration(m.waitMeanMs)} · P90 ${reviewDuration(m.waitP90Ms)}</p><p>${Object.entries(m.stages).map(([k,v])=>`${escapeHtml(groupMrPhases[k]||k)}：${reviewDuration(v)}`).join(' · ')}（已结束阶段中位数）</p><p>人工明确反馈：AI 漏检 ${m.missed} 次 · AI 误报 ${m.falsePositive} 次。AI 有效率：暂无逐条确认数据。</p><p>有效知识 ${m.knowledge} 条 · 知识加载 ${m.knowledgeUses} 次（加载不等于发现问题）</p></details>`:''}`;}
    function reviewTodos(allUt,allMr){const failed=overviewUi.filter==='mr'?[]:allUt,rows=overviewUi.filter==='ut'?[]:allMr;return `<div class="studio-section-head"><div><h2 id="overview-pending-heading" tabindex="-1">待处理事项 <span class="qw-count">${allUt.length+allMr.length}</span></h2><span class="qw-muted">当前未处理事项，不受成果周期限制</span></div><nav class="overview-filters" aria-label="待处理事项类型">${[['all','全部'],['ut','UT 治理'],['mr','MR 检视']].map(([key,label])=>`<button class="${overviewUi.filter===key?'active':''}" data-overview-filter="${key}" aria-pressed="${overviewUi.filter===key}">${label}</button>`).join('')}</nav></div><section class="panel qw-table-wrap review-todos-wrap"><table class="qw-table review-todos"><thead><tr><th>任务 / 服务</th><th>事项 / 阻塞原因</th><th>已等待</th><th>待处理人</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeHtml(groupMrRepo(r))}<span class="qw-sub">MR !${escapeHtml(r.iid)}</span></td><td>${escapeHtml(groupMrPhases[r.phase])}<span class="qw-sub review-todo-reason" title="${escapeHtml(agentDisplayText(r.status))}">${escapeHtml(agentDisplayText(r.status))}</span></td><td>${reviewDuration(Date.now()-Date.parse(r.humanStartedAt||r.updatedAt))}</td><td>${escapeHtml(r.phase==='HUMAN'?r.notification?.receiver||groupMrUi.config?.authorizedSender||'未配置':'任务处理人')}</td><td><button class="qw-link" data-review-open="${escapeHtml(r.id)}">${r.phase==='HUMAN'?'去审核':'查看原因'} →</button></td></tr>`).join('')}${failed.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td><span class="review-todo-reason" title="${escapeHtml(r.result)}">${escapeHtml(r.result)}</span></td><td>${reviewDuration(Date.now()-Date.parse(r.time))}</td><td>任务处理人</td><td><button class="qw-link" ${r.kind==='ut'?`data-governance-detail="${escapeHtml(r.id)}"`:`data-studio-record="${r.kind}" data-record-id="${escapeHtml(r.id)}"`}>查看原因 →</button></td></tr>`).join('')}${!rows.length&&!failed.length?'<tr><td colspan="5" class="governance-empty">当前没有需要处理的事项</td></tr>':''}</tbody></table></section>`;}
    function humanReviewPanel(r){if(r.humanReviewSkipped)return '<p class="qw-muted">本次任务已按接收时配置跳过人工审核，仍需通过 CodeHub 权限和合并门禁。</p>';if(r.shortcut)return '<p class="qw-muted">授权账号已明确指令合入，无需页面人工审核。</p>';const records=reviewUi.reviews.filter(x=>x.repo===r.repo&&x.iid===r.iid).sort((a,b)=>b.time.localeCompare(a.time)),draft=(reviewUi.drafts[r.id]?.sha===r.sha?reviewUi.drafts[r.id]:null)||{decision:'',reason:'',category:''};if(r.phase!=='HUMAN'&&!records.length)return '';return `<section class="panel review-human"><div class="studio-section-head"><h2>人工审核</h2><button class="qw-link" data-review-knowledge="${escapeHtml(r.repo)}">服务知识 →</button></div><p class="qw-muted">结论仅对当前提交 ${escapeHtml(r.sha?.slice(0,12)||'未确认')} 生效 · 操作记为平台人工审核</p><p>${r.notification?.status==='sent'?'已通过 WeLink MCP 私聊提醒 '+escapeHtml(r.notification.receiver):r.notification?'私聊提醒发送未确认，请核对 WeLink 配置；不自动重发':'进入待审后私聊提醒授权用户'}</p>${r.phase==='HUMAN'?`<form data-human-review="${escapeHtml(r.id)}" data-review-sha="${escapeHtml(r.sha)}"><div class="review-choices"><label><input type="radio" name="decision" value="pass" ${draft.decision==='pass'?'checked':''} required>通过</label><label><input type="radio" name="decision" value="reject" ${draft.decision==='reject'?'checked':''}>不通过</label></div><label class="qw-field"><span>原因分类 · 可选</span><select name="category">${['','业务问题','AI 漏检','AI 误报','验证不足','已确认兼容','其他'].map(c=>`<option value="${c}" ${c===draft.category?'selected':''}>${c||'请选择'}</option>`).join('')}</select></label><label class="qw-field"><span>审核理由 · 不通过时必填</span><textarea id="human-reason-${escapeHtml(r.id)}" name="reason" rows="4" maxlength="4000" placeholder="说明为什么通过，或指出需要修改的问题">${escapeHtml(draft.reason)}</textarea></label><button class="button primary" type="submit" ${groupMrRecordBusy(r)||r.running?'disabled':''}>${groupMrRecordBusy(r)?'提交中…':r.running?'检查或提醒中…':'提交审核'}</button></form>`:''}<h3>审核记录</h3>${records.map(x=>`<div class="review-history"><span class="badge ${x.decision==='pass'?'green':'red'}">${x.decision==='pass'?'通过':'不通过'}</span> ${escapeHtml(qwDate(x.time))} · ${escapeHtml(x.sha.slice(0,12))}<p>${escapeHtml(x.reason||'未填写理由')}</p><small>知识整理：${({pending:'待整理',running:'整理中',done:'已完成',failed:'失败',skipped:'无具体理由，仅保留记录'})[x.knowledgeStatus]} ${escapeHtml(agentDisplayText(x.knowledgeError||''))}</small>${x.knowledgeStatus==='failed'?`<button class="qw-link" data-knowledge-retry="${x.id}">重新整理</button>`:''}</div>`).join('')||'<p class="qw-muted">尚无审核记录</p>'}${r.knowledgeIds?.length?`<p class="qw-muted">本次加载知识：${r.knowledgeIds.map(id=>escapeHtml(reviewUi.items.find(k=>k.id===id)?.title||id)).join('、')}</p>`:''}</section>`;}
    function reviewKnowledgeContent(){const repos=[...new Set(reviewUi.items.map(k=>k.repo).concat(reviewUi.reviews.map(r=>r.repo)))];if(!repos.includes(reviewUi.service))reviewUi.service=repos[0]||'';const items=reviewUi.items.filter(k=>k.repo===reviewUi.service);return `<div class="quality-workspace review-knowledge">${qwHeader('服务知识','按仓库隔离审核经验；未确认多服务归属的内容保留在仓库范围。','<button class="button" data-automation-nav="settings">返回设置</button>')}<div class="studio-section-head"><select id="knowledge-service" aria-label="服务或仓库">${repos.map(r=>`<option value="${escapeHtml(r)}" ${r===reviewUi.service?'selected':''}>${escapeHtml(r)}</option>`).join('')}</select><span>${items.filter(k=>k.status==='active').length} / 20 条有效知识</span><button class="qw-link" data-review-refresh>刷新</button></div>${reviewUi.error?`<p role="alert">${escapeHtml(reviewUi.error)}</p>`:''}${items.map(k=>`<article class="panel review-human"><h3>${escapeHtml(k.title)} <span class="badge">${({active:'有效',pending:'待确认',disabled:'已停用'})[k.status]}</span></h3><p>${escapeHtml(k.content)}</p>${k.conflictsWith?`<p class="qw-muted">与“${escapeHtml(reviewUi.items.find(v=>v.id===k.conflictsWith)?.title||k.conflictsWith)}”存在冲突，请先停用不再适用的知识。</p>`:''}<p class="qw-muted">适用范围：${escapeHtml(k.scope)}</p><details><summary>来源 · ${k.sources.length} 条审核记录</summary>${k.sources.map(id=>{const r=reviewUi.reviews.find(r=>r.id===id);return r?`<p>${escapeHtml(r.repo)} !${escapeHtml(r.iid)} · ${escapeHtml(r.sha.slice(0,12))}<br>${escapeHtml(r.reason)}</p>`:'<p>来源记录不可用</p>';}).join('')}</details><div class="head-actions"><button class="qw-link" data-knowledge-edit="${k.id}">编辑</button><button class="qw-link" data-knowledge-toggle="${k.id}">${k.status==='active'?'停用':'确认启用'}</button></div></article>`).join('')||'<section class="panel governance-empty">暂无可复用经验。提交人工审核后，Agent 会结合改动与历史整理。</section>'}</div>`;}
    document.addEventListener('input',e=>{const form=e.target.closest('[data-human-review]');if(form){const data=new FormData(form);reviewUi.drafts[form.dataset.humanReview]={...Object.fromEntries(data),sha:form.dataset.reviewSha};}});

    document.addEventListener('submit',async e=>{const form=e.target.closest('[data-human-review]');if(!form)return;e.preventDefault();const id=form.dataset.humanReview;if(groupMrRecordBusy(id))return;const r=groupMrUi.pending.find(r=>r.id===id);if(!r)return;if(r.sha!==form.dataset.reviewSha){delete reviewUi.drafts[id];showToast('提交已变化，请重新审核当前版本');render(false);return;}const input=Object.fromEntries(new FormData(form));if(input.decision==='reject'&&!input.reason.trim()){showToast('请填写不通过原因');return;}groupMrUi.recordWrites.add(id);groupMrUi.request++;render(false);try{const result=await autoUtCall('/api/automation/group-mr/records/'+encodeURIComponent(id)+'/human-review',jsonOptions('POST',{...input,sha:form.dataset.reviewSha}));if(result?.humanReview)Object.assign(r,result);delete reviewUi.drafts[id];showToast('审核记录已保存');}catch(error){showToast(error.message);}finally{groupMrUi.recordWrites.delete(id);groupMrUi.request++;render(false);void loadGroupMr();void loadReviewData();}});

    function formatJsonText(text,pretty){
      JSON.parse(text); // Validate grammar; preserve original numeric tokens and duplicate keys.
      const tokens=text.match(/"(?:\\.|[^"\\])*"|[{}\[\],:]|[^\s{}\[\],:]+/g)||[];
      if(!pretty)return tokens.join('');let depth=0,out='';
      const newline=()=>{out+='\n'+'  '.repeat(depth);};
      for(let i=0;i<tokens.length;i++){const t=tokens[i];
        if(t==='{'||t==='['){out+=t;depth++;if(tokens[i+1]!=='}'&&tokens[i+1]!==']')newline();}
        else if(t==='}'||t===']'){depth--;if(tokens[i-1]!=='{'&&tokens[i-1]!=='[')newline();out+=t;}
        else if(t===','){out+=t;newline();}else if(t===':')out+=': ';else out+=t;
      }return out;

      for(const key of ['code','name','config'])form.elements[key].oninput=invalidate;
      const read=async file=>{if(!file)return;if(file.size>524288){status.textContent='配置文件不能超过 512 KiB';return;}try{const text=await file.text(),value=JSON.parse(text);invalidate();form.elements.config.value=JSON.stringify(value,null,2);form.elements.code.value=Array.isArray(value)?file.name.replace(/\.json$/i,''):value.code||'';form.elements.name.value=Array.isArray(value)?'':value.name||'';status.textContent='文件已读取，请核对命令码和名称后校验';}catch(e){status.textContent='读取失败：'+e.message;}};
      dialog.querySelector('#ct-config-file').onchange=e=>void read(e.target.files[0]);const drop=dialog.querySelector('#ct-config-drop');drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();void read(e.dataTransfer.files[0]);};
      const definition=()=>{const value=JSON.parse(form.elements.config.value);return {code:form.elements.code.value,name:form.elements.name.value,fields:Array.isArray(value)?value:value.fields,sample:Array.isArray(value)?'':value.sample||''};};
      dialog.querySelector('[data-validate]').onclick=async()=>{if(busy)return;const current=++token;save.disabled=true;try{status.textContent='正在校验…';const input=definition();const result=await autoUtCall('/api/tools/binlog/commands/validate',jsonOptions('POST',input));if(current!==token)return;validated={input,result};dialog.querySelector('#ct-config-conflict').hidden=!result.conflict;status.textContent=result.conflict?'校验通过，但命令已存在：'+result.conflict.name+'。确认覆盖后保存。':'校验通过，可以注册新命令';save.disabled=!!result.conflict;}catch(e){if(current===token){validated=null;status.textContent='校验失败：'+e.message;}}};
      replace.onchange=()=>save.disabled=!validated||!!validated.result.conflict&&!replace.checked;
      form.onsubmit=async e=>{e.preventDefault();if(busy||!validated||validated.result.conflict&&!replace.checked)return;busy=true;form.querySelectorAll('input,textarea,button').forEach(x=>x.disabled=true);try{const result=await autoUtCall('/api/tools/binlog/commands',jsonOptions('POST',{definition:validated.input,expectedRevision:validated.result.conflict?.revision??null}));toolUi.code=result.code;toolUi.result=null;await loadToolCommands(true);busy=false;close();showToast('命令配置已保存');}catch(error){status.textContent='保存失败：'+error.message+'。请重新校验。';validated=null;}finally{busy=false;form.querySelectorAll('input,textarea,button').forEach(x=>x.disabled=false);save.disabled=true;}};
    }

    initNavigation();
  </script>
</body>
</html>
