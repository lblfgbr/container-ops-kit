<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Studio</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --ink: #202b33;
      --muted: #66737d;
      --faint: #8e99a2;
      --line: #e1e6e9;
      --brand: #3563e9;
      --brand-soft: #edf2ff;
      --green: #16836e;
      --green-soft: #e9f5f2;
      --violet: #5267c7;
      --violet-soft: #eef1fb;
      --amber: #a96f16;
      --amber-soft: #fff4df;
      --red: #c64c4c;
      --red-soft: #fff0ef;
      --shadow: 0 1px 2px rgba(25, 39, 48, .04);
      --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 14px/1.55 var(--font); font-weight: 400; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    strong, b { font-weight: 600; }
    h1 { font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -.02em; }
    h2 { font-size: 16px; line-height: 1.35; font-weight: 600; }
    h3 { font-size: 14px; font-weight: 600; }
    .mono { font-family: var(--mono); }
    .taiji { width: 30px; height: 30px; flex: 0 0 auto; }
    .taiji svg { display: block; width: 100%; height: 100%; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .status.ok { color: var(--green); }
    .status.ok::before { background: var(--green); }
    .status.warn { color: var(--amber); }
    .status.warn::before { background: var(--amber); }
    .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 99px; color: var(--muted); background: #eef1f3; font-size: 12px; font-weight: 500; }
    .badge.brand { color: var(--brand); background: var(--brand-soft); }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.violet { color: var(--violet); background: var(--violet-soft); }
    .badge.amber { color: var(--amber); background: var(--amber-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .button { border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; color: var(--ink); background: var(--surface); font-weight: 500; }
    .button:hover { border-color: #b9c3c9; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .button.primary { color: white; border-color: var(--brand); background: var(--brand); }
    .button.ghost { color: var(--muted); background: transparent; }
    .button.small { padding: 6px 9px; font-size: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 49px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .panel-body { padding: 16px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .page-head p { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .metric-value { font-size: 26px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-foot { margin-top: 3px; color: var(--faint); font-size: 12px; }
    .attention-list, .activity-list { display: grid; }
    .attention-row, .activity-row { display: grid; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .attention-row:last-child, .activity-row:last-child { border-bottom: 0; }
    .attention-row { grid-template-columns: auto minmax(0,1fr) auto; }
    .attention-row strong, .activity-row strong { display: block; font-size: 14px; font-weight: 500; }
    .attention-row p, .activity-row p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .activity-row { grid-template-columns: 58px minmax(0,1fr) auto; }
    .activity-time { color: var(--faint); font: 12px var(--mono); }
    .workspace-tabs { display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
    .workspace-tabs button { border: 0; border-radius: 8px; padding: 8px 12px; color: var(--muted); background: transparent; font-weight: 500; }
    .workspace-tabs button.active { color: var(--brand); background: var(--brand-soft); }
    .environment-bar { display: grid; grid-template-columns: minmax(220px,1.2fr) repeat(4,minmax(100px,.7fr)) auto; gap: 16px; align-items: center; margin-bottom: 16px; padding: 15px 17px; border-radius: 10px; color: white; background: #253744; }
    .environment-bar strong { display: block; }
    .environment-bar small { display: block; margin-top: 3px; color: #b9c4cb; font-size: 12px; }
    .environment-bar select { width: 100%; border: 1px solid #50616c; border-radius: 7px; padding: 8px 9px; color: white; background: #314550; font-weight: 500; }
    .environment-item span { display: block; color: #9baab3; font-size: 12px; }
    .environment-item b { display: block; margin-top: 3px; font-size: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--ink); background: var(--surface-soft); }
    .repo-list { display: grid; gap: 9px; margin-top: 15px; }
    .repo-row { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px; border-radius: 9px; background: var(--surface-soft); }
    .repo-row span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .repo-row-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
    .repo-row-title span { margin-bottom: 0; }
    .repo-row > * { min-width: 0; }
    .repo-row input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; background: white; }
    .build-layout { display: grid; grid-template-columns: 390px minmax(0,1fr); gap: 16px; align-items: start; }
    .summary-stack { display: grid; gap: 14px; }
    .progress { height: 7px; overflow: hidden; border-radius: 99px; background: #e8ecef; }
    .progress span { display: block; width: 62%; height: 100%; background: var(--brand); }
    .terminal { min-height: 210px; padding: 15px; border-radius: 9px; color: #c2ccd2; background: #1d2b34; font: 12px/1.75 var(--mono); }
    .terminal b { color: #7ed2c3; }
    .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .resource-card { padding: 19px; }
    .resource-card-top { display: flex; justify-content: space-between; gap: 12px; }
    .resource-card p { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .connection-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 16px; }
    .connection { padding: 11px; border-radius: 8px; background: var(--surface-soft); }
    .connection span { color: var(--muted); font-size: 12px; }
    .connection strong { display: block; margin-top: 4px; font-size: 12px; }
    .empty { min-height: 420px; display: grid; place-items: center; text-align: center; }
    .empty-symbol { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 16px; color: var(--violet); background: var(--violet-soft); font-size: 24px; }
    .empty p { max-width: 470px; margin-top: 7px; color: var(--muted); }
    .variant-a-shell { min-height: 100vh; }
    .variant-a-sidebar { position: fixed; inset: 0 auto 0 0; width: 208px; display: flex; flex-direction: column; padding: 18px 12px 14px; background: #f1f4f6; border-right: 1px solid var(--line); }
    .variant-a-brand { display: flex; align-items: center; gap: 9px; padding: 0 6px 16px; }
    .variant-a-brand strong { display: block; white-space: nowrap; color: #263740; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
    .variant-a-brand span { display: block; margin-top: 1px; color: #7b8891; font-size: 12px; font-weight: 400; }
    .platform-switch { display: grid; gap: 3px; margin: 0 0 14px; padding: 5px; border: 1px solid #dde3e7; border-radius: 11px; background: #e9edef; }
    .platform-switch-title { padding: 3px 7px 5px; color: var(--faint); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .platform-symbol { width: 26px; height: 26px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 7px; color: #60717c; background: rgba(255,255,255,.58); font-size: 12px; font-weight: 700; }
    .platform-option { width: 100%; display: grid; grid-template-columns: 26px minmax(0,1fr) auto; align-items: center; gap: 9px; border: 0; border-radius: 8px; padding: 7px 8px; color: #5d6b74; background: transparent; text-align: left; transition: color .15s ease,background .15s ease,box-shadow .15s ease; }
    .platform-option:hover { color: var(--ink); background: rgba(255,255,255,.66); }
    .platform-option.active { color: var(--brand); background: white; box-shadow: 0 1px 4px rgba(25,39,48,.1); font-weight: 600; }
    .platform-option.active .platform-symbol { color: white; background: var(--brand); }
    .platform-option small { color: var(--faint); font-size: 10px; font-weight: 400; }
    .variant-a-nav { display: grid; gap: 2px; }
    .variant-a-nav .nav-section { margin: 14px 9px 4px; color: var(--faint); font-size: 12px; font-weight: 500; }
    .variant-a-nav button { width: 100%; border: 0; border-radius: 7px; padding: 8px 10px; color: #53616b; background: transparent; text-align: left; font-size: 14px; font-weight: 400; }
    .variant-a-nav button.active { color: var(--ink); background: white; box-shadow: inset 2px 0 var(--brand); font-weight: 600; }
    .variant-a-user { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .variant-a-main { min-height: 100vh; margin-left: 208px; padding: 24px; }
    .variant-a-status-strip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
    .variant-a-status-item { min-width: 0; padding: 17px 18px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); box-shadow: 0 1px 2px rgba(25,39,48,.03); transition: border-color .15s ease,transform .15s ease; }
    .variant-a-status-item:hover { border-color: #c7d0d5; transform: translateY(-1px); }
    .variant-a-status-top { display: flex; align-items: baseline; gap: 9px; }
    .variant-a-columns { display: grid; grid-template-columns: minmax(0,7fr) minmax(320px,5fr); gap: 16px; }
    .variant-a-overview { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 16px; }
    .platform-placeholder { min-height: calc(100vh - 48px); display: grid; place-items: center; text-align: center; }
    .platform-placeholder-content { max-width: 430px; padding: 48px; }
    .platform-placeholder-symbol { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; color: var(--brand); background: var(--brand-soft); font-size: 22px; font-weight: 600; }
    .platform-placeholder h1 { font-size: 24px; }
    .platform-placeholder p { margin-top: 8px; color: var(--muted); }
    .platform-boundary { display: inline-flex; margin-top: 18px; padding: 5px 9px; border-radius: 99px; color: var(--muted); background: #eef1f3; font-size: 12px; }
    .capability-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,360px)); gap: 16px; }
    .capability-card { min-height: 150px; padding: 20px; text-align: left; }
    .capability-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .capability-symbol { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; color: var(--brand); background: var(--brand-soft); font-weight: 700; }
    .capability-card p { margin-top: 16px; color: var(--muted); font-size: 13px; }
    .auto-ut-layout { display: grid; grid-template-columns: minmax(320px,.8fr) minmax(0,1.4fr); gap: 16px; align-items: start; }
    .auto-ut-file { display: grid; gap: 7px; margin-top: 14px; }
    .auto-ut-file input { width: 100%; border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: var(--surface-soft); }
    .auto-ut-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .auto-ut-list { display: grid; gap: 8px; }
    .auto-ut-row { display: grid; grid-template-columns: minmax(130px,1fr) minmax(190px,1.3fr) 110px; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .auto-ut-row:last-child { border-bottom: 0; }
    .auto-ut-row p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .auto-ut-row code { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-repository-editor { min-width: 0; display: flex; align-items: center; gap: 7px; }
    .auto-ut-repository-editor input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; color: var(--ink); background: white; font: 11px/1.4 "Cascadia Code",Consolas,monospace; }
    .auto-ut-workspace { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); text-align: left; }
    .auto-ut-workspace span:last-child { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-schedule-line { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .auto-ut-schedule-copy { min-width: 0; margin-right: auto; }
    .auto-ut-schedule-copy strong, .auto-ut-schedule-copy small { display: block; }
    .auto-ut-schedule-copy small { margin-top: 2px; color: var(--muted); }
    .auto-ut-schedule-line input[type="time"] { width: 104px; border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; background: white; }
    .auto-ut-directory-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: rgba(18,30,38,.34); }
    .auto-ut-directory-dialog { width: min(620px,100%); max-height: min(640px,80vh); display: flex; flex-direction: column; border-radius: 12px; background: white; box-shadow: 0 24px 70px rgba(18,30,38,.24); }
    .auto-ut-directory-head, .auto-ut-directory-footer { display: flex; align-items: center; gap: 9px; padding: 14px 16px; }
    .auto-ut-directory-head { border-bottom: 1px solid var(--line); }
    .auto-ut-directory-head>div{min-width:0;display:grid;gap:2px;margin-right:auto}.auto-ut-directory-head small{color:var(--muted)}.auto-ut-directory-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-directory-path{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fafc}.auto-ut-directory-path input{min-width:0;flex:1}.auto-ut-directory-error{margin:10px 16px 0;padding:9px 11px;border-radius:6px;background:#fff2f0;color:#b54c3e}.auto-ut-directory-list { min-height: 220px; overflow: auto; padding: 8px; }
    .auto-ut-directory-entry { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 7px; padding: 10px; background: transparent; text-align: left; cursor: pointer; }
    .auto-ut-directory-entry:hover,.auto-ut-directory-entry:focus-visible { background: var(--surface-soft); }.auto-ut-directory-entry small{margin-left:auto;color:var(--brand);opacity:0}.auto-ut-directory-entry:hover small,.auto-ut-directory-entry:focus-visible small{opacity:1}.auto-ut-directory-empty{padding:28px 16px;text-align:center;color:var(--muted)}.directory-writable,.directory-readonly{margin-right:auto;font-size:12px}.directory-writable{color:#43835a}.directory-readonly{color:var(--muted)}
    .auto-ut-directory-footer { justify-content: flex-end; border-top: 1px solid var(--line); }
    .auto-ut-progress { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: var(--surface-soft); }
    .auto-ut-progress span { display: block; height: 100%; border-radius: inherit; background: var(--brand); transition: width .25s ease; }
    .auto-ut-task-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .auto-ut-cleanup-control { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 14px 0 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); }
    .auto-ut-cleanup-control > div { display: grid; gap: 3px; }
    .auto-ut-cleanup-control span { color: var(--muted); font-size: 12px; }
    .auto-ut-live { grid-column: 1 / -1; min-width: 0; display: grid; gap: 8px; margin-top: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
    .auto-ut-live-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .auto-ut-live-head span { color: var(--muted); font-size: 12px; }
    .auto-ut-conversation { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .auto-ut-conversation-part { display: block; border: 0; border-bottom: 1px solid var(--line); background: transparent; }
    .auto-ut-conversation-part:last-child { border-bottom: 0; }
    .auto-ut-conversation-part summary,.auto-ut-conversation-part > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; color: var(--muted); cursor: pointer; user-select: none; list-style: none; }
    .auto-ut-conversation-part summary::-webkit-details-marker { display: none; }
    .auto-ut-conversation-part summary small,.auto-ut-conversation-part > header small { color: var(--faint); font-size: 10px; }
    .auto-ut-prompt summary { color: var(--brand); font-weight: 600; }
    .auto-ut-reply > header { cursor: default; }
    .auto-ut-stream-block { min-width: 0; }
    .auto-ut-stream-block > strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .auto-ut-stream-text { max-height: 260px; overflow: auto; margin: 0; padding: 10px 11px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 7px; font: 12px/1.65 "Cascadia Code",Consolas,"Microsoft YaHei UI",monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auto-ut-conversation .auto-ut-stream-text { max-height: 320px; border: 0; border-top: 1px solid #eef1f5; border-radius: 0; background: #fbfcfe; }
    .auto-ut-tool-list { display: grid; gap: 6px; }
    .auto-ut-tool { border-bottom: 1px solid var(--line); background: transparent; }
    .auto-ut-tool:last-child { border-bottom: 0; }
    .auto-ut-tool-head { display: flex; align-items: center; gap: 8px; padding: 9px 4px; cursor: pointer; list-style: none; }
    .auto-ut-tool-head::-webkit-details-marker { display: none; }
    .auto-ut-tool-head strong { font-size: 12px; }
    .auto-ut-tool-head span { margin-left: auto; color: var(--muted); font-size: 11px; }
    .auto-ut-tool.error .auto-ut-tool-head span { color: var(--red); }
    .auto-ut-tool-body { padding: 0 4px 10px 20px; }
    .auto-ut-tool-body small { color: var(--faint); font-size: 10px; }
    .auto-ut-tool pre { max-height: 220px; overflow: auto; margin: 5px 0 9px; color: var(--muted); font: 11px/1.55 "Cascadia Code",Consolas,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auto-ut-operation-list { display: grid; gap: 5px; }
    .auto-ut-operation { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 7px; background: white; font-size: 12px; }
    .auto-ut-operation i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px rgba(25,114,120,.12); }
    .auto-ut-operation.done i { background: var(--green); box-shadow: none; }
    .auto-ut-operation.error i { background: var(--red); box-shadow: none; }
    .auto-ut-operation span { color: var(--muted); font-size: 11px; }
    .auto-ut-operation code { grid-column: 2 / -1; font-size: 10px; }
    .overview-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; }
    .overview-card p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .overview-card-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
    .task-table { margin-top: 16px; }
    .task-row { display: grid; grid-template-columns: minmax(220px,1.4fr) minmax(180px,1fr) minmax(160px,.8fr) 100px 70px; gap: 16px; align-items: center; min-height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .task-row:last-child { border-bottom: 0; }
    .task-row.head { min-height: 36px; color: var(--faint); background: var(--surface-soft); font-size: 12px; }
    .task-row strong { font-weight: 500; }
    .task-row span { color: var(--muted); font-size: 12px; }
    .resource-workspace { display: grid; gap: 16px; }
    .environment-summary { display: grid; grid-template-columns: minmax(300px,1.35fr) repeat(3,minmax(150px,.65fr)); gap: 12px; }
    .environment-version-card, .environment-summary-stat { min-height: 104px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); box-shadow: 0 1px 2px rgba(25,39,48,.03); }
    .environment-version-card { display: flex; align-items: center; justify-content: space-between; gap: 18px; background: linear-gradient(135deg,#243744,#314b58); color: white; }
    .environment-version-card label { color: #d8e2e7; font-size: 13px; font-weight: 600; }
    .environment-version-card select { min-width: 180px; border: 1px solid #61737d; border-radius: 8px; padding: 9px 10px; color: white; background: #39515d; font-weight: 600; }
    .environment-summary-stat { display: grid; align-content: center; gap: 3px; }

      { id: 'container-27a-01', type: 'container', version: 'r27c00', name: '27A 容器环境 01', ip: '10.28.4.16', port: '22', user: 'sopuser', workdir: '/opt/cok/runtime', architecture: 'x86_64', sshPasswordConfigured: true, maePasswordConfigured: true, osmuPasswordConfigured: true, status: 'untested', lastTest: '尚未测试', latency: '—', outcome: 'online', mae: 'mae-27a-01', maeUser: 'maeadmin', osmu: 'osmu-27a-01', osmuUser: 'osmuadmin', history: [] },
    ];

    const tasks = [];

    const statusPresentation = {
      online: { label: '可连接', className: 'ok' },
      error: { label: '连接失败', className: 'error' },
      untested: { label: '未测试', className: '' }
    };

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    function selectedEnvironment(type) {
      const key = type === 'build' ? 'selectedBuildEnvironment' : 'selectedContainerEnvironment';
      return environments.find(item => item.id === state[key]) || environments.find(item => item.type === type);
    }

    const taiji = `<div class="taiji" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#191c22" stroke-width="3"/><path d="M50 3a47 47 0 0 1 0 94 23.5 23.5 0 0 1 0-47 23.5 23.5 0 0 0 0-47Z" fill="#191c22"/><circle cx="50" cy="26.5" r="7" fill="#191c22"/><circle cx="50" cy="73.5" r="7" fill="#fff"/></svg></div>`;

    function pageTitle(title, copy, actions = '') {
      return `<div class="page-head"><div><h1>${title}</h1><p>${copy}</p></div><div class="head-actions">${actions}</div></div>`;
    }

    function attentionRows() {
      return `<div class="attention-list"><div class="attention-row"><span class="badge red">失败</span><div><strong>构建任务 build-1048 执行失败</strong><p>swmfrontendservice · master · 上海构建环境</p></div><button class="button small">查看</button></div><div class="attention-row"><span class="badge amber">待确认</span><div><strong>2 个产物等待部署确认</strong><p>生产容器环境 · mae 命名空间</p></div><button class="button small">处理</button></div><div class="attention-row"><span class="badge amber">告警</span><div><strong>production-mae 存在 1 个异常工作负载</strong><p>OSMU 状态已同步 · 3 分钟前</p></div><button class="button small">进入运维</button></div></div>`;
    }

    function activityRows() {
      return `<div class="activity-list"><div class="activity-row"><span class="activity-time">10:42</span><div><strong>release-0828 构建完成</strong><p>swmfrontendservice/master、fmemateservice/master</p></div><span class="badge green">成功</span></div><div class="activity-row"><span class="activity-time">10:16</span><div><strong>user-service 部署完成</strong><p>生产容器环境 · OM om-prod-01</p></div><span class="badge green">已部署</span></div><div class="activity-row"><span class="activity-time">09:58</span><div><strong>构建环境连接恢复</strong><p>上海构建环境 · build-01</p></div><span class="badge">资源</span></div></div>`;
    }

    function taskBadge(task) {
      const className = task.status === 'failed' ? 'red' : task.status === 'running' ? 'brand' : 'green';
      return `<span class="badge ${className}">${escapeHtml(task.statusLabel)}</span>`;
    }

    function recentTasks() {
      const rows = tasks.slice(0, 5).map(task => `<div class="task-row"><strong>${escapeHtml(task.id)}</strong><span>${escapeHtml(task.input)}</span><span>${escapeHtml(task.environment)}</span><span>${taskBadge(task)}</span><span>${escapeHtml(task.updated)}</span></div>`).join('');
      return `<section class="panel task-table"><div class="panel-head"><h2>最近任务</h2><button class="button small ghost">查看全部任务</button></div><div class="task-row head"><span>任务</span><span>输入</span><span>环境</span><span>状态</span><span>更新时间</span></div>${rows}</section>`;
    }

    function createTask(kind, input, environment, statusLabel = '执行中') {
      const id = `${kind}-${Date.now()}`;
      tasks.unshift({ id, kind, input, environment, status: 'running', statusLabel, updated: '刚刚' });
      state.page = 'dashboard';
      render();
      showToast(`已创建任务 ${id}`);
      setTimeout(() => {
        const task = tasks.find(item => item.id === id);
        if (!task) return;
        task.status = 'success';
        task.statusLabel = kind === 'deploy' ? '已部署' : '成功';
        task.updated = '刚刚';
        render(false);
      }, 1800);
    }

    function createBuildTask(mode = 'single') {
      const environment = selectedEnvironment('build');
      if (!environment) {
        showToast('请先配置构建环境');
        return;
      }
      createTask('build', mode === 'compare' ? '双分支对比构建' : '2 个业务仓 · master', environment.name);
    }

    function createDeployTask() {
      const environment = selectedEnvironment('container');
      if (!environment) {
        showToast('请先配置容器环境');
        return;
      }
      createTask('deploy', 'user-service · a82f91', environment.name, '部署中');
    }

    function environmentBar() {
      const environment = selectedEnvironment('build');

    let studioDialogActive=false;
    function studioDialog(message,input=false){
      if(studioDialogActive)return Promise.resolve(input?null:false);
      studioDialogActive=true;
      return new Promise(resolve=>{
        const previous=document.activeElement,overlay=document.createElement('div');overlay.className='studio-confirm-backdrop';
        overlay.innerHTML='<section class="studio-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="studio-confirm-title" aria-describedby="studio-confirm-message" tabindex="-1"><h2 id="studio-confirm-title"></h2><p id="studio-confirm-message"></p><textarea data-studio-input aria-label="填写原因" rows="3"></textarea><div class="studio-confirm-actions"><button class="button" data-studio-cancel>取消</button><button class="button primary" data-studio-confirm>确认</button></div></section>';
        overlay.querySelector('h2').textContent=input?'填写原因':'请确认操作';overlay.querySelector('p').textContent=message;
        const field=overlay.querySelector('textarea'),ok=overlay.querySelector('[data-studio-confirm]'),cancel=overlay.querySelector('[data-studio-cancel]');field.hidden=!input;ok.disabled=input;
        const siblings=[...document.body.children].map(el=>[el,el.inert]);for(const [el] of siblings)el.inert=true;
        const overflow=document.body.style.overflow;document.body.style.overflow='hidden';document.body.append(overlay);
        let settled=false;
        const finish=value=>{if(settled)return;settled=true;overlay.remove();for(const [el,inert] of siblings)el.inert=inert;document.body.style.overflow=overflow;window.removeEventListener('hashchange',cancelOnNavigation);studioDialogActive=false;if(previous?.isConnected)previous.focus();resolve(value);};
        const cancelOnNavigation=()=>finish(input?null:false);window.addEventListener('hashchange',cancelOnNavigation);
        field.addEventListener('input',()=>ok.disabled=!field.value.trim());
        cancel.addEventListener('click',cancelOnNavigation);ok.addEventListener('click',()=>finish(input?field.value.trim():true));
        overlay.addEventListener('click',e=>{if(e.target===overlay)cancelOnNavigation();});
        overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancelOnNavigation();}if(e.key==='Tab'){const items=[field,cancel,ok].filter(el=>!el.hidden&&!el.disabled),i=items.indexOf(document.activeElement);e.preventDefault();items[(i+(e.shiftKey?-1:1)+items.length)%items.length].focus();}});
        (input?field:cancel).focus();
      });
    }
    function studioConfirm(message){return studioDialog(message);}
    function studioPrompt(message){return studioDialog(message,true);}

    async function deleteEnvironment(environment) {
      if (!environment || testTokens.has(environment.id)) return;
      if (selectedReleaseVersion().locked) {
        showToast('历史版本环境为只读');
        return;
      }
      if (!(await studioConfirm(`确定删除“${environment.name}”吗？删除后无法恢复。`))) return;
      const index = environments.findIndex(item => item.id === environment.id);
      if (index < 0) return;
      environments.splice(index, 1);
      if (state.selectedBuildEnvironment === environment.id) state.selectedBuildEnvironment = '';
      if (state.selectedContainerEnvironment === environment.id) state.selectedContainerEnvironment = '';
      render(false);
      showToast('环境已删除');
    }

      }

      const containerPasswordCopy = configured => editing && configured ? '已配置；留空表示不修改' : '请输入独立密码';

      return `<div class="drawer-backdrop" data-close-drawer></div><aside class="environment-drawer"><div class="drawer-header"><div><h2>${title}</h2><p>${editing ? '密码独立维护；已配置密码不会在页面中回显。' : '新环境必须设置独立密码。'}</p></div><button class="button ghost" data-close-drawer>关闭</button></div><form id="environment-form" class="drawer-body" data-environment-id="${editing ? source?.id || '' : ''}" data-environment-type="${type}"><section class="drawer-section"><div class="drawer-section-title"><h3>基本信息</h3></div><div class="drawer-grid">${typeField}<div class="field wide"><label>环境名称</label><input name="name" required value="${escapeHtml(name)}" placeholder="例如：${selectedReleaseVersion().name} ${type === 'build' ? '构建环境 01' : '容器环境 01'}"></div><div class="field"><label>发布版本</label><select name="version">${releaseVersions.map(item => `<option value="${item.id}" ${item.id === version ? 'selected' : ''} ${item.locked ? 'disabled' : ''}>${item.code} · ${item.name}${item.locked ? ' · 只读' : ''}</option>`).join('')}</select></div><div class="field"><label>系统架构</label><select name="architecture"><option value="x86_64" ${source?.architecture !== 'aarch64' ? 'selected' : ''}>x86</option><option value="aarch64" ${source?.architecture === 'aarch64' ? 'selected' : ''}>ARM</option></select></div></div></section><section class="drawer-section"><div class="drawer-section-title"><h3>SSH 连接</h3><p>测试连接验证 SSH 登录并自动识别系统架构。</p></div><div class="drawer-grid"><div class="field"><label>${type === 'container' ? 'OM 节点 IP' : 'IP 地址'}</label><input name="ip" required value="${escapeHtml(source?.ip || '')}" placeholder="10.20.12.31"></div><div class="field"><label>SSH 端口</label><input name="port" required value="${escapeHtml(source?.port || '22')}"></div><div class="field"><label>固定用户</label><div class="readonly-value mono">${user}</div></div><div class="field"><label>密码</label><input name="password" type="password" ${editing ? '' : 'required'} placeholder="${sshPasswordCopy}"></div><div class="field wide"><label>工作目录</label><input name="workdir" required value="${escapeHtml(source?.workdir || '')}" placeholder="/opt/cok"></div></div><div id="drawer-test-result" class="drawer-test-result" aria-live="polite"></div></section>${type === 'container' ? `<section class="drawer-section"><div class="drawer-section-title"><h3>容器连接</h3><p>MAE 与 OSMU 分别维护，不纳入 SSH 连接测试。</p></div><div class="drawer-grid"><div class="field"><label>MAE 地址</label><input name="mae" value="${escapeHtml(source?.mae || '')}" placeholder="mae-prod-01"></div><div class="field"><label>MAE 账号</label><input name="maeUser" value="${escapeHtml(source?.maeUser || '')}" placeholder="请输入账号"></div><div class="field wide"><label>MAE 密码</label><input name="maePassword" type="password" ${editing ? '' : 'required'} placeholder="${containerPasswordCopy(source?.maePasswordConfigured)}"></div><div class="field"><label>OSMU 地址</label><input name="osmu" value="${escapeHtml(source?.osmu || '')}" placeholder="osmu-prod-01"></div><div class="field"><label>OSMU 账号</label><input name="osmuUser" value="${escapeHtml(source?.osmuUser || '')}" placeholder="请输入账号"></div><div class="field wide"><label>OSMU 密码</label><input name="osmuPassword" type="password" ${editing ? '' : 'required'} placeholder="${containerPasswordCopy(source?.osmuPasswordConfigured)}"></div></div></section>` : ''}</form><div class="drawer-footer"><button class="button" data-close-drawer>取消</button><button class="button" data-drawer-test>测试连接</button><button class="button primary" data-save-environment>保存环境</button></div></aside>`;
    }

    function commonPage(page) {
      if (page === 'build') return `${pageTitle('构建', '选择构建环境，配置仓库与分支，然后生成可部署产物。','<button class="button" data-page="resources">查看环境</button>')}${buildContent()}`;
      if (page === 'resources') return `${pageTitle('环境管理', '按发布版本维护构建与容器环境，集中验证 SSH 连通性。')}${resourceContent()}`;
      if (page === 'deploy') return `${pageTitle('部署', '选择成功产物和容器环境，完成校验后部署。')}${containerEnvironmentBar()}<section class="panel empty"><div><div class="empty-symbol">⇧</div><h2>选择待部署产物</h2><p>部署只使用当前容器环境；当前可部署产物 2 个。</p><button class="button primary" style="margin-top:18px" data-create-deploy-task>选择产物</button></div></section>`;

    const autoUtStatus = {
      DISCOVERED: '待执行', WAITING_REPOSITORY: '仓库未配置', PREPARING: '准备工作区', BASELINE_RUNNING: '基线测试',
      REPAIRING: '修复中', VERIFYING: '验证中', WAITING_CONFIRMATION: '等待继续', RETRY_PENDING: '等待重试', WAITING_EXTERNAL: '等待处理',

    };

    const autoUtActiveStatus = new Set(['DISCOVERED', 'PREPARING', 'BASELINE_RUNNING', 'REPAIRING', 'VERIFYING', 'PR_CREATING', 'MR_PENDING', 'MR_REPAIRING']);

    let autoUtPollTimer;
    let autoUtLiveRenderTimer;
    const autoUtEventSources = new Map();

    function autoUtLiveState(taskId) {

    }

    function readAutoUtView(taskId) {
      try { const value=JSON.parse(sessionStorage.getItem('ut-view:'+taskId)||'{}');return {open:value.open||{},follow:value.follow!==false,top:Number(value.top)||0}; } catch { return {open:{},follow:true,top:0}; }
    }
    function saveAutoUtView(taskId) {

    }
    function captureAutoUtView() {
      document.querySelectorAll('[data-auto-ut-live]').forEach(panel=>{
        const live=autoUtLiveState(panel.dataset.autoUtLive);
        panel.querySelectorAll('[data-ut-entry]').forEach(detail=>{if(detail.open!==(detail.dataset.utDefaultOpen==='true'))live.ui.open[detail.dataset.utEntry]=detail.open;});

    }
    function bindAutoUtView() {
      document.querySelectorAll('[data-auto-ut-live]').forEach(panel=>{
        const taskId=panel.dataset.autoUtLive,live=autoUtLiveState(taskId),feed=panel.querySelector('[data-ut-feed]');
        if(feed){
          feed.scrollTop=live.ui.follow?feed.scrollHeight:live.ui.top;live.ui.top=feed.scrollTop;
          if(!feed.dataset.utScrollBound){
            feed.dataset.utScrollBound='true';
            feed.addEventListener('scroll',()=>{if(feed.scrollTop===live.ui.top)return;live.ui.top=feed.scrollTop;live.ui.follow=feed.scrollHeight-feed.clientHeight-feed.scrollTop<32;const follow=panel.querySelector('[data-ut-follow]');if(follow)follow.checked=live.ui.follow;const jump=panel.querySelector('[data-ut-latest]');if(jump)jump.hidden=live.ui.follow;saveAutoUtView(taskId);},{passive:true});
            feed.addEventListener('pointerdown',event=>{live.ui.interacting=true;if(event.clientX>=feed.getBoundingClientRect().right-24){live.ui.follow=false;saveAutoUtView(taskId);}window.addEventListener('pointerup',()=>{if(!live.ui.interacting)return;live.ui.interacting=false;if(live.ui.pendingRender){live.ui.pendingRender=false;render(false);}else refreshAutoUtLivePanel();},{once:true});});
            feed.addEventListener('pointercancel',()=>{live.ui.interacting=false;});
          }
        }
        panel.querySelectorAll('[data-ut-entry]').forEach(detail=>{
          if(detail._utBound)return;detail._utBound=true;
          detail.querySelector('summary').addEventListener('click',()=>{
            live.ui.follow=false;if(feed)live.ui.top=feed.scrollTop;
            const checkbox=panel.querySelector('[data-ut-follow]');if(checkbox)checkbox.checked=false;
            const jump=panel.querySelector('[data-ut-latest]');if(jump)jump.hidden=false;
            live.ui.open[detail.dataset.utEntry]=!detail.open;saveAutoUtView(taskId);
          });
          detail.addEventListener('toggle',()=>{if(!detail.isConnected||detail.open===(detail.dataset.utDefaultOpen==='true'))return;live.ui.open[detail.dataset.utEntry]=detail.open;saveAutoUtView(taskId);});
        });
        const follow=panel.querySelector('[data-ut-follow]');follow?.addEventListener('change',()=>{live.ui.follow=follow.checked;if(feed&&live.ui.follow)feed.scrollTop=feed.scrollHeight;saveAutoUtView(taskId);});
        panel.querySelector('[data-ut-latest]')?.addEventListener('click',()=>{live.ui.follow=true;if(follow)follow.checked=true;if(feed)feed.scrollTop=feed.scrollHeight;panel.querySelector('[data-ut-latest]').hidden=true;saveAutoUtView(taskId);});
      });
    }
    function refreshAutoUtLivePanel() {
      if(state.platformDomain!=='automation'||!['auto-ut','tasks'].includes(state.automationPage))return;
      const item=state.autoUtTasks.find(task=>task.id===workspaceUi.selectedTaskId);
      const panel=document.querySelector('[data-auto-ut-live]');if(!item||!panel)return;
      const live=autoUtLiveState(item.id);if(live.ui.interacting)return;
      const selection=window.getSelection();if(selection&&!selection.isCollapsed&&panel.contains(selection.anchorNode))return;
      const focused=document.activeElement;
      const detailFocus=panel.contains(focused)&&focused?.tagName==='SUMMARY'?focused.parentElement.dataset.utEntry:null;
      const followFocus=panel.contains(focused)&&focused?.hasAttribute('data-ut-follow');
      captureAutoUtView();
      // Keep identical output mounted: polling must not interrupt selecting text or opening a detail.
      const html=autoUtLivePanel(item,workspaceUi.taskDetailTab||'pi');
      if(panel._renderedHtml===html)return;
      const template=document.createElement('template');template.innerHTML=html;
      const next=template.content.firstElementChild,feed=panel.querySelector('[data-ut-feed]'),nextFeed=next.querySelector('[data-ut-feed]');
      panel.querySelector('.auto-ut-live-head').innerHTML=next.querySelector('.auto-ut-live-head').innerHTML;
      const conversation=feed.querySelector('.auto-ut-conversation'),nextConversation=nextFeed.querySelector('.auto-ut-conversation');
      if(conversation&&nextConversation){
        const existing=new Map([...conversation.querySelectorAll('[data-ut-event]')].map(node=>[node.dataset.utEvent,node]));
        let cursor=conversation.firstElementChild;
        for(const incoming of [...nextConversation.children]){
          const previous=existing.get(incoming.dataset.utEvent);
          let node=previous||incoming;
          if(previous&&previous.outerHTML!==incoming.outerHTML){
            const detail=previous.querySelector('details'),nextDetail=incoming.querySelector('details');
            if(detail&&nextDetail){
              detail.dataset.utDefaultOpen=nextDetail.dataset.utDefaultOpen;
              detail.open=nextDetail.open;
              for(const selector of ['summary','.ut-agent-tool-body','.ut-agent-text']){
                const part=detail.querySelector(selector),nextPart=nextDetail.querySelector(selector);
                if(part&&nextPart&&part.innerHTML!==nextPart.innerHTML)part.innerHTML=nextPart.innerHTML;
              }
              previous.className=incoming.className;
            }else previous.innerHTML=incoming.innerHTML;
          }
          existing.delete(incoming.dataset.utEvent);
          if(node!==cursor)conversation.insertBefore(node,cursor);
          cursor=node.nextElementSibling;
        }
        for(const stale of existing.values())stale.remove();
        conversation.querySelector('.ut-task-log-empty')?.remove();
      }else if(feed.innerHTML!==nextFeed.innerHTML)feed.innerHTML=nextFeed.innerHTML;
      panel.querySelector('.ut-agent-toolbar').innerHTML=next.querySelector('.ut-agent-toolbar').innerHTML;
      const result=panel.querySelector('.ut-agent-result'),nextResult=next.querySelector('.ut-agent-result');
      if(result&&nextResult)result.replaceWith(nextResult);else if(result)result.remove();else if(nextResult)panel.append(nextResult);
      const updated=panel;updated._renderedHtml=html;
      bindAutoUtView();
      if(detailFocus)[...updated.querySelectorAll('[data-ut-entry]')].find(el=>el.dataset.utEntry===detailFocus)?.querySelector('summary')?.focus({preventScroll:true});
      if(followFocus)updated.querySelector('[data-ut-follow]')?.focus({preventScroll:true});
    }
    function recordAutoUtEntry(live,event) {
      live.raw.push(event);if(live.raw.length>200)live.raw.shift();
      const kind=event.type==='prompt'?'prompt':event.type.startsWith('thinking_')?'thinking':event.type.startsWith('message_')?'message':null;
      if(kind){
        let entry=live.entries.at(-1);
        if(!entry||entry.kind!==kind||event.type.endsWith('_start')||kind==='prompt'){
          entry={id:'entry-'+event.sequence,kind,text:'',time:event.time,attempt:live.promptAttempt};live.entries.push(entry);
        }
        if(event.content)entry.text=trimAutoUtOutput(entry.text+event.content);
      }else if(event.type.startsWith('tool_')||event.type.startsWith('operation_')){
        const kind=event.type.startsWith('tool_')?'tool':'operation';
        if(!live.entries.some(entry=>entry.kind===kind&&entry.ref===event.toolCallId))live.entries.push({id:kind+'-'+event.toolCallId,kind,ref:event.toolCallId,time:event.time});
      }else if(event.type==='error'||event.type==='status'||event.type==='completed'){
        live.entries.push({id:'entry-'+event.sequence,kind:'status',text:event.content,time:event.time,error:event.error||event.type==='error'});
      }
      if(live.entries.length>160)live.entries.splice(0,live.entries.length-160);
    }

    function trimAutoUtOutput(value) {
      return value.length > 60000 ? value.slice(-60000) : value;
    }

    function applyAutoUtLiveEvent(taskId, event) {
      const live = autoUtLiveState(taskId);
      if (event.sequence && event.sequence <= live.sequence) return;
      live.sequence = Math.max(live.sequence, event.sequence || 0);
      recordAutoUtEntry(live,event);
      if (event.type === 'prompt') { live.prompt = event.content || ''; live.promptAttempt = event.toolCallId || ''; live.status = '任务已发送给 Agent'; if(!workspaceUi.taskDetailTab&&(!workspaceUi.selectedTaskId||workspaceUi.selectedTaskId===taskId))workspaceUi.taskDetailTab='pi'; }
      if (event.type === 'thinking_start') { live.thinkingActive = true; }
      if (event.type === 'thinking_delta') live.thinking = trimAutoUtOutput(live.thinking + (event.content || ''));
      if (event.type === 'thinking_end') live.thinkingActive = false;
      if (event.type === 'message_delta') live.message = trimAutoUtOutput(live.message + (event.content || ''));
      if (event.type === 'status' || event.type === 'completed') live.status = event.content || live.status;
      if (event.type === 'error') { live.status = event.content || 'Agent 执行失败'; live.error = true; }
      if (event.type === 'operation_start') {
        live.operations[event.toolCallId] = { id: event.toolCallId, name: event.content, command: event.toolName, status: '执行中', error: false };
        live.status = event.content || live.status;
      }
      if (event.type === 'operation_end') {
        const operation = live.operations[event.toolCallId] ||= { id: event.toolCallId, name: event.content, command: '', status: '执行中', error: false };
        operation.status = event.error ? '失败' : '完成';
        operation.error = Boolean(event.error);
        live.status = event.error ? `${operation.name}失败` : `${operation.name}完成`;
      }
      if (event.type === 'tool_start') {
        live.status = `正在调用 ${event.toolName || '工具'}`;
        live.tools[event.toolCallId] = { id: event.toolCallId, name: event.toolName, args: event.content, output: '', status: '执行中', error: false };
        const toolIds = Object.keys(live.tools);
        if (toolIds.length > 160) toolIds.slice(0, toolIds.length - 160).forEach(id => delete live.tools[id]);
      }
      if (event.type === 'tool_output' || event.type === 'tool_end') {
        const tool = live.tools[event.toolCallId] ||= { id: event.toolCallId, name: event.toolName, args: '', output: '', status: '执行中', error: false };
        tool.output = trimAutoUtOutput(event.replace ? (event.content || '') : tool.output + (event.content || ''));
        if (event.type === 'tool_end') { tool.status = event.error ? '失败' : '完成'; tool.error = Boolean(event.error); }
      }
      if (!autoUtLiveRenderTimer) autoUtLiveRenderTimer = setTimeout(() => {
        autoUtLiveRenderTimer = null;
        refreshAutoUtLivePanel();
      }, event.type === 'completed' || event.type === 'error' ? 0 : 120);
    }

    function connectAutoUtStream(taskId) {
      if (typeof EventSource !== 'function' || autoUtEventSources.has(taskId)) return;
      const after = state.autoUtLive[taskId]?.sequence || 0;
      const source = new EventSource(`/api/auto-ut/tasks/${encodeURIComponent(taskId)}/events?afterSequence=${after}`);
      source.onmessage = message => {
        try { applyAutoUtLiveEvent(taskId, JSON.parse(message.data)); }
        catch (error) { autoUtLiveState(taskId).status = '无法解析 Agent 实时事件'; }
      };
      autoUtEventSources.set(taskId, source);
    }

    function ensureAutoUtStreams() {
      if (state.platformDomain !== 'automation' || !['auto-ut','tasks'].includes(state.automationPage)) return;
      const latest = state.autoUtTasks;
      const streamableIds = new Set(latest.filter(task => task.id===workspaceUi.selectedTaskId&&autoUtStreamableStatus.has(task.status)).map(task => task.id));
      autoUtEventSources.forEach((source, taskId) => {
        if (!streamableIds.has(taskId)) { source.close(); autoUtEventSources.delete(taskId); }
      });
      latest.filter(task => streamableIds.has(task.id)).forEach(task => connectAutoUtStream(task.id));
    }

    function closeAutoUtStreams() {
      autoUtEventSources.forEach(source => source.close());
      autoUtEventSources.clear();
    }

    // Normalize legacy platform labels at presentation time; keep commands and user content intact.
    function agentDisplayText(text) { return String(text||'').replace(/\bPi\b/g,'Agent'); }
    function autoUtDisplayStatus(text) {
      return agentDisplayText(text).replace(/第\s*\d+\s*轮[-·：:]?\s*/g,'').replaceAll('最大修复轮次','自动修复上限').replaceAll('下一轮修复','继续修复');
    }
    function autoUtRichText(text) {
      // Escape first; deliberately support only a safe subset of Markdown (no HTML or links).
      return escapeHtml(text||'').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
    }
    function autoUtEntry(item,live,entry) {
      const time=entry.time?new Date(entry.time).toLocaleTimeString('zh-CN',{hour12:false}):'';
      const tool=entry.kind==='tool'?live.tools[entry.ref]:entry.kind==='operation'?live.operations[entry.ref]:null;
      const name=tool?(tool.name||'执行操作'):({prompt:'任务输入',thinking:'Agent · 分析过程',message:'Agent · 回复',status:'执行状态'}[entry.kind]||'执行记录');
      const content=tool?`<div class="ut-agent-tool-body">${tool.args?`<small>输入参数</small><pre>${escapeHtml(tool.args)}</pre>`:''}${tool.command?`<pre>${escapeHtml(tool.command)}</pre>`:''}${tool.output?`<small>执行输出</small><pre>${escapeHtml(tool.output)}</pre>`:''}</div>`:`<div class="ut-agent-text">${autoUtRichText(entry.kind==='status'?autoUtDisplayStatus(entry.text):entry.text)}</div>`;
      const header=`<span>${escapeHtml(autoUtDisplayStatus(name))}</span><span class="ut-agent-event-meta">${tool?escapeHtml(tool.status):''} <time>${escapeHtml(time)}</time></span>`;
      const collapsible=tool||entry.kind==='prompt'||entry.kind==='thinking',open=live.ui.open[entry.id]??Boolean(tool?.error);
      return `<article class="ut-agent-event ${tool?.error||entry.error?'error':''}" data-ut-event="${escapeHtml(entry.id)}">${collapsible?`<details data-ut-entry="${escapeHtml(entry.id)}" data-ut-default-open="${open}" ${open?'open':''}><summary>${header}</summary>${content}</details>`:`<header>${header}</header>${content}`}</article>`;
    }
    function autoUtLivePanel(item, tab = 'process') {
      const current=autoUtLiveState(item.id);
      const entries=current.entries.filter(entry=>entry.text||entry.ref).map(entry=>autoUtEntry(item,current,entry)).join('');
      const operations=Object.values(current.operations||{}).map(operation=>`<div class="auto-ut-operation ${operation.error?'error':operation.status==='完成'?'done':''}"><i></i><strong>${escapeHtml(autoUtDisplayStatus(operation.name||'执行步骤'))}</strong><span>${escapeHtml(operation.status)}</span>${operation.command?`<code>${escapeHtml(operation.command)}</code>`:''}</div>`).join('');
      const history=(item.history||[]).map(event=>`<div class="ut-task-history-line"><time>${escapeHtml(qwDate(event.time))}</time><span>${escapeHtml(autoUtStatus[event.status]||event.status)}</span><p>${escapeHtml(event.message)}</p></div>`).join('');
      const raw=current.entries.map(entry=>{
        const heading=entry.time?entry.time+' ':'';
        if(entry.kind==='tool'){const tool=current.tools[entry.ref];return tool?`${heading}[工具 ${tool.name||''} · ${tool.status}]\n${tool.args||''}\n${tool.output||''}`:'';}

        const label={message:'回复',thinking:'思考',prompt:'提示词',status:entry.error?'错误':'状态'}[entry.kind]||entry.kind;

      }).filter(Boolean).join('\n\n');

    async function autoUtCall(path, options = {}) {

      return response.json();

    async function copyToClipboard(value) {
      try {
        if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(value); return; }
      } catch { /* Permission denied: try the browser's legacy copy operation. */ }
      const previous = document.activeElement;
      const textarea = document.createElement('textarea');
      textarea.value = value;
      textarea.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(textarea);
      try {
        textarea.select();
        if (!document.execCommand?.('copy')) throw new Error('复制失败，请手动复制');
      } finally {
        textarea.remove();
        previous?.focus?.({preventScroll:true});
      }
    }

    function finishConnectionTest(environment, token, batchMode = false) {
      if (testTokens.get(environment.id) !== token) return;
      testTokens.delete(environment.id);
      const success = environment.outcome === 'online';
      environment.status = success ? 'online' : 'error';
      environment.lastTest = '刚刚';
      environment.latency = success ? `${72 + environments.indexOf(environment) * 7} ms` : '连接超时';
      environment.history.unshift({ time: '刚刚', status: environment.status, copy: success ? `模拟 SSH 连接成功 · ${environment.latency}` : '模拟连接超时 · 10 秒' });
      if (batchMode && state.batch && state.batch.targetIds.includes(environment.id)) {
        state.batch.completed += 1;
        state.batch[success ? 'passed' : 'failed'] += 1;
        if (state.batch.completed === state.batch.total) {

    function qwRatio(value){if(value===null||value===undefined||value==='')return NaN;const text=String(value).trim(),number=text.endsWith('%')?Number(text.slice(0,-1))/100:Number(text);return Number.isFinite(number)?number:NaN;}

    function mrTaskControls(item){if(!item.mr?.iid||item.governance?.mrState!=='PENDING')return '';const m=item.mr,names={SETUP:'完善 MR 信息',PIPELINE:'等待流水线',REVIEW:'等待检视',APPROVE:'等待审核',MERGE:'等待合入'};return `<section class="qw-notice"><strong>${escapeHtml(names[m.phase]||m.phase)}${m.paused?' · 已暂停':''}</strong><p>${escapeHtml(m.error||'MR 合入后任务才会完成。')} · 自动修复 ${m.rounds}/${m.config.maxRepairRounds} 轮</p><div class="head-actions"><button class="button" data-mr-control="${m.paused?'retry':'pause'}" data-task-id="${escapeHtml(item.id)}">${m.paused?'重试当前步骤':'暂停自动处理'}</button>${m.phase==='PIPELINE'&&m.paused&&m.pipelineId&&!m.writePending?`<button class="button" data-mr-control="rerun-pipeline" data-task-id="${escapeHtml(item.id)}">重跑流水线</button>`:''}<button class="qw-link" data-mr-control="check" data-task-id="${escapeHtml(item.id)}">刷新合入状态</button>${Object.values(m.notifications||{}).some(n=>n.pending)?`<button class="qw-link" data-mr-control="retry-notifications" data-task-id="${escapeHtml(item.id)}">重发未确认通知</button>`:''}<button class="qw-link" data-mr-control="apply-settings" data-task-id="${escapeHtml(item.id)}">应用最新人员配置</button></div></section>`;}
    function bindMrInteractions(){
      document.querySelectorAll('[data-mr-config]').forEach(el=>el.addEventListener('input',()=>{const keys=el.dataset.mrConfig.split('.');let obj=mrUi.draft;for(const key of keys.slice(0,-1))obj=obj[key];obj[keys.at(-1)]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):keys[0]==='roles'?commaList(el.value):el.value.trim();}));
      document.querySelectorAll('[data-mr-repository]').forEach(el=>el.addEventListener('input',()=>mrUi.draft.repositories[Number(el.dataset.mrRepository)].repository=el.value.trim()));
      document.querySelectorAll('[data-mr-repo-role]').forEach(el=>el.addEventListener('input',()=>{const roles=mrUi.draft.repositories[Number(el.dataset.mrRepoRole)].roles,value=el.value.trim();if(!value)delete roles[el.dataset.role];else roles[el.dataset.role]=value==='-'?[]:commaList(value);}));
      document.querySelector('[data-mr-add]')?.addEventListener('click',()=>{mrUi.draft.repositories.push({repository:'',roles:{}});render(false);});
      document.querySelectorAll('[data-mr-remove]').forEach(el=>el.addEventListener('click',()=>{mrUi.draft.repositories.splice(Number(el.dataset.mrRemove),1);render(false);}));
      document.querySelector('#mr-account-map')?.addEventListener('input',e=>{mrUi.draft.welinkAccounts=Object.fromEntries(e.target.value.split('\n').filter(v=>v.trim()).map(v=>{const [a,b]=v.split('=');return[a?.trim()||'',b?.trim()||''];}));});
      document.querySelectorAll('[data-mr-control]').forEach(el=>el.addEventListener('click',async()=>{if(el.dataset.mrControl==='retry-notifications'&&!(await studioConfirm('请先确认之前的通知未送达。继续重新发送这些通知？')))return;el.disabled=true;try{await autoUtCall('/api/auto-ut/tasks/'+encodeURIComponent(el.dataset.taskId)+'/mr-control',jsonOptions('POST',{action:el.dataset.mrControl}));await loadAutoUtTasks();render(false);}catch(e){showToast(e.message);el.disabled=false;}}));
    }

    function qwPlanBlockReason(){if(!state.autoUtPlan.length)return '';return state.autoUtUsername&&state.autoUtWorkspace?'':'请在左下角连接与设置填写用户名和项目路径。';}
    function qwPlanFilter(key,label){return `<select id="qw-plan-${key}" aria-label="筛选${label}"><option value="">全部${label}</option>${[...new Set(state.autoUtPlan.map(p=>p[key]))].filter(Boolean).sort().map(v=>`<option value="${escapeHtml(v)}" ${workspaceUi[key==='team'?'planTeam':'planLanguage']===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select>`;}
    function qwPlanEntries(){return state.autoUtPlan.filter(p=>(!workspaceUi.planVersion||p.version===workspaceUi.planVersion)&&(!workspaceUi.planTeam||p.team===workspaceUi.planTeam)&&(!workspaceUi.planLanguage||p.language===workspaceUi.planLanguage)&&[p.repository,p.language,p.team].filter(Boolean).join(' ').toLowerCase().includes(workspaceUi.planSearch.toLowerCase()));}
    function utLanguageKey(value){const name=(value||'Java').trim().toLowerCase();return ['js','javascript','jsx','javascript/jsx'].includes(name)?'JS':name==='java'?'Java':name;}
    function qwPlanKey(p){return p.version+'/'+p.repository+(utLanguageKey(p.language)==='JS'?'/JS':'');}
    function qwSelectable(p){const run=utVersionRun(p.version),v=reportUi.config.versions.find(v=>v.version===p.version),ticket=v&&reportVersionTicket(reportUi.config,p.version),record=utTicketRecord(p.version);return !!(p.repairSupported!==false&&utScopeMatches(run)&&p.configured&&v?.baseBranch===p.baseBranch&&ticket&&!reportUi.config.versions.some(v=>v.version!==p.version&&reportVersionTicket(reportUi.config,v.version)===ticket)&&(!record||record.status==='READY')&&!qwPlanTask(p)&&!(run?.claimed||[]).includes(qwPlanKey(p)));}
    function qwPlanTask(p){
      if(p.repairSupported===false)return;
      const run=utVersionRun(p.version),matches=state.autoUtTasks.filter(t=>t.repository.toLowerCase()===p.repository.toLowerCase()&&utLanguageKey(t.language)===utLanguageKey(p.language)&&(t.reportVersion===p.version||!t.reportVersion&&t.baseBranch===p.baseBranch));
      const current=matches.filter(t=>t.sourceReportId===run?.id||(run?.taskIds||[]).includes(t.id));
      return (current.length?current:matches.filter(utTaskBlocks)).sort((a,b)=>String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||'')))[0];
    }
    function qwPlanProgress(p){
      const task=qwPlanTask(p);if(!task&&p.repairSupported===false)return '<td><span class="qw-muted">当前语言暂不支持自动修复</span></td><td>—</td>';if(!task)return '<td><span class="qw-muted">'+((utVersionRun(p.version)?.claimed||[]).includes(qwPlanKey(p))?'暂无可用任务记录':'未开始')+'</span></td><td><span class="qw-muted">—</span></td>';
      const progress=Number.isFinite(task.progress)?Math.max(0,Math.min(100,task.progress)):0;
      const stage=task.status==='MR_REPAIRING'?'流水线修复':autoUtStage[task.nextStage]||autoUtStatus[task.status]||'等待执行';
      return `<td><div class="qw-plan-progress"><span>${escapeHtml(stage)} · ${progress}%</span><div class="qw-plan-track" role="progressbar" aria-label="${escapeHtml(p.repository+' 治理进度')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><i style="width:${progress}%"></i></div><small>${escapeHtml(autoUtStatus[task.status]||task.status)}</small></div></td><td><button class="qw-link" data-governance-detail="${escapeHtml(task.id)}">详情 →</button></td>`;
    }
    function qwPlanTable(){const all=qwPlanEntries(),foot=qwPagination('plan',all.length),items=all.slice((workspaceUi.planPage-1)*20,workspaceUi.planPage*20),selected=items.filter(qwSelectable),allSelected=selected.length&&selected.every(p=>reportUi.selected.has(qwPlanKey(p)));return `<div class="qw-table-wrap">${items.length?`<table class="qw-table"><thead><tr><th><input type="checkbox" data-qw-select-all aria-label="全选本页可执行仓库" ${allSelected?'checked':''}></th><th>代码仓</th><th>版本 / 基础分支</th><th>失败用例</th><th>行覆盖率 / 目标</th><th>分支覆盖率 / 目标</th><th>仓库配置</th><th>治理进度</th><th>操作</th></tr></thead><tbody>${items.map(p=>`<tr class="${qwPlanTask(p)?'ut-task-locked':''}"><td><input type="checkbox" aria-label="选择 ${escapeHtml(p.version+' '+p.repository)}" data-report-select="${escapeHtml(qwPlanKey(p))}" ${p.repairSupported!==false&&reportUi.selected.has(qwPlanKey(p))?'checked':''} ${qwSelectable(p)?'':'disabled'}></td><td class="qw-repo">${escapeHtml(p.repository)}<span class="qw-sub">${escapeHtml((p.language||'Java')+' · '+(p.team||'Access_智能驾舱组'))}</span><span class="qw-sub">${p.repairSupported===false?'当前语言暂不支持自动修复':utVersionRun(p.version)?.claimed.includes(qwPlanKey(p))?'已提交治理，请查看进度':!p.configured?'需配置分支并重新获取':''}</span></td><td><span class="badge">${escapeHtml(p.version)}</span><span class="qw-sub">${escapeHtml(p.baseBranch||'未配置分支')}</span></td><td class="${p.failedTests>0?'qw-cell-bad':''}">${p.failedTests}</td><td>${qwMetric(p.lineCoverage,p.lineGoal)}</td><td>${p.language==='Cpp'?'不适用':qwMetric(p.branchCoverage,p.branchGoal)}</td><td><button class="qw-link" data-qw-repository="${escapeHtml(p.repository)}">${p.repositoryCustomized?'已保存 · 修改':'默认仓库 · 修改'}</button></td>${qwPlanProgress(p)}</tr>`).join('')}</tbody></table>`:qwEmpty(state.autoUtPlan.length?'没有匹配的仓库':'等待获取 UT 报告',state.autoUtPlan.length?'调整版本筛选或搜索条件。':'先获取报告，再选择需要修复的仓库与版本。')}</div>${foot}`;}
    function qualityConnectionPanel(){const c=qualityUi.connection;return `<div class="qw-tip">质量检查与 UT 治理 共用此连接配置。</div><label class="qw-field"><span>Grafana 查询接口</span><input data-q-connection="url" value="${escapeHtml(c.url)}" required type="url"></label><div class="qw-two">${[['datasourceId','数据源 ID',1,999999],['timeoutSeconds','单次查询超时（秒，最多重试 3 次）',5,30],['parallel','并发查询数',1,4]].map(([k,n,min,max])=>`<label class="qw-field"><span>${n}</span><input type="number" min="${min}" max="${max}" required data-q-connection="${k}" value="${c[k]}"></label>`).join('')}<label class="qw-field"><span>认证方式</span><select data-q-connection="auth"><option value="none" ${c.auth==='none'?'selected':''}>无认证</option><option value="token" ${c.auth==='token'?'selected':''}>后端 Token</option></select></label></div><p class="qw-muted">使用 Token 时，在后端配置 QUALITY_GRAFANA_TOKEN；页面不保存或回显凭据。</p>`;}

    function createRequestUuid(){
      if(typeof globalThis.crypto?.randomUUID==='function')return globalThis.crypto.randomUUID();
      if(typeof globalThis.crypto?.getRandomValues!=='function')throw new Error('浏览器不支持安全随机数，请更换浏览器后重试。');
      const bytes=globalThis.crypto.getRandomValues(new Uint8Array(16));
      bytes[6]=(bytes[6]&0x0f)|0x40;
      bytes[8]=(bytes[8]&0x3f)|0x80;
      const hex=Array.from(bytes,value=>value.toString(16).padStart(2,'0')).join('');
      return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
    }

    function schedulesContent(){const items=schedulerUi.items.filter(s=>(!schedulerUi.kind||s.task.kind===schedulerUi.kind)&&(!schedulerUi.status||(s.enabled?'enabled':'paused')===schedulerUi.status)&&[s.name,...scheduleVersions(s)].join(' ').toLowerCase().includes(schedulerUi.query.toLowerCase()));return `<div class="quality-workspace">${qwHeader('定时任务','统一查看质量检查与 UT 治理的执行计划。','<button class="button" data-schedule-refresh>刷新</button><button class="button primary" data-schedule-new="quality">＋ 创建计划</button>')}<div class="qw-stats">${qwStat('全部计划',schedulerUi.items.length,'每个计划保存独立配置','◷')}${qwStat('已启用',schedulerUi.items.filter(s=>s.enabled).length,'到达时间后由后端执行','✓')}${qwStat('执行中',schedulerUi.items.filter(s=>s.running).length,'暂停不会终止当前执行','⟳')}</div><section class="panel"><div class="qw-toolbar"><input id="schedule-query" class="qw-search" placeholder="搜索名称或版本" value="${escapeHtml(schedulerUi.query)}"><select id="schedule-kind" aria-label="所属工具"><option value="">全部工具</option>${Object.entries(schedulerNames).filter(([v])=>['quality','auto-ut'].includes(v)||schedulerUi.items.some(s=>s.task.kind===v)).map(([v,n])=>`<option value="${v}" ${schedulerUi.kind===v?'selected':''}>${n}</option>`).join('')}</select><select id="schedule-status" aria-label="启用状态"><option value="">全部状态</option><option value="enabled" ${schedulerUi.status==='enabled'?'selected':''}>已启用</option><option value="paused" ${schedulerUi.status==='paused'?'selected':''}>已暂停</option></select></div><div class="qw-table-wrap">${items.length?`<table class="qw-table"><thead><tr>${['任务名称 / 工具','版本范围','执行频率','状态','下次执行','最近结果','操作'].map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${items.map(s=>`<tr><td><b>${escapeHtml(s.name)}</b><span class="qw-sub">${schedulerNames[s.task.kind]}</span></td><td>${scheduleVersions(s).map(v=>`<span class="badge">${escapeHtml(v)}</span>`).join(' ')}</td><td>${escapeHtml(scheduleCadence(s))}</td><td><span class="badge ${s.enabled?'green':''}">${s.enabled?'已启用':'已暂停'}</span>${s.running?'<span class="badge brand">执行中</span>':''}</td><td>${s.nextRunAt?escapeHtml(new Date(s.nextRunAt).toLocaleString('zh-CN',{timeZone:s.timing.timezone})):'—'}</td><td>${s.lastRun?`<button class="qw-link" data-schedule-runs="${s.id}">${qwStatuses[s.lastRun.status]||s.lastRun.status}</button><span class="qw-sub">${qwDate(s.lastRun.createdAt)}</span>`:'暂无记录'}</td><td><div class="head-actions">${['quality','auto-ut'].includes(s.task.kind)?`<button class="qw-link" data-schedule-edit="${s.id}">编辑</button>`:''}<button class="qw-link" data-schedule-toggle="${s.id}" ${schedulerUi.busy||!s.enabled&&!['quality','auto-ut'].includes(s.task.kind)?'disabled':''}>${s.enabled?'暂停':'启用'}</button><button class="qw-link" data-schedule-run="${s.id}" ${s.running||schedulerUi.busy||!['quality','auto-ut'].includes(s.task.kind)?'disabled':''}>立即执行</button><button class="qw-link" data-schedule-runs="${s.id}">记录</button><button class="qw-link" data-schedule-delete="${s.id}" ${s.running||schedulerUi.busy?'disabled':''}>删除</button></div></td></tr>`).join('')}</tbody></table>`:qwEmpty('暂无匹配的定时任务','从质量检查或 UT 治理带入配置，也可以在这里创建计划。')}</div></section>${qwDrawer()}</div>`;}
    async function loadSchedules(){if(typeof fetch!=='function')return;try{const items=await autoUtCall('/api/automation/schedules');if(!Array.isArray(items))return;schedulerUi.items=items;if(state.platformDomain==='automation')render(false);}catch(e){showToast(e.message);}finally{clearTimeout(schedulerUi.poll);if(state.platformDomain==='automation')schedulerUi.poll=setTimeout(loadSchedules,10000);}}
    function newSchedule(kind='quality'){if(!['quality','auto-ut'].includes(kind))return showToast('此类型已不提供新建，请使用质量检查或 UT 治理');const t={frequency:'weekdays',weekday:1,time:'09:30',timezone:'Asia/Shanghai'};captureAutoUtInputs();const config=JSON.parse(JSON.stringify(reportUi.config));Object.assign(config,{username:state.autoUtUsername,ticket:state.autoUtTicket,workspaceRoot:state.autoUtWorkspace});if(kind==='auto-ut')config.schedule.action='REPAIR';const task=kind==='quality'?{kind,query:{versions:commaList(qualityUi.versions),teams:commaList(qualityUi.teams),domain:qualityUi.domain,kinds:[...qualityUi.kinds]},dateMode:'yesterday'}:kind==='auto-ut-cleanup'?{kind,retentionDays:30}:{kind,config};schedulerUi.editing=null;schedulerUi.draft={name:kind==='quality'?'每日质量检查':kind==='auto-ut-cleanup'?'UT 任务与代码定时清理':'UT 治理计划',enabled:true,timing:t,task};qwOpen({type:'managed-schedule'});}

    function cleanupScheduleForm(){const s=schedulerUi.draft,t=s.timing;return `<div class="qw-tip">只清理超过保留天数且已结束或等待人工处理的任务。运行中的任务不会删除；任务记录、本地 clone 目录和任务明细日志会一起清理。</div><label class="qw-field"><span>任务名称</span><input required maxlength="100" data-sched-field="name" value="${escapeHtml(s.name)}"></label><label class="qw-checks"><input type="checkbox" data-sched-field="enabled" ${s.enabled?'checked':''}>启用计划</label><h3>何时执行</h3><div class="qw-two"><label class="qw-field"><span>频率</span><select data-sched-time="frequency">${[['daily','每天'],['weekdays','工作日'],['weekly','每周']].map(([v,n])=>`<option value="${v}" ${t.frequency===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="qw-field"><span>时间</span><input required type="time" data-sched-time="time" value="${t.time}"></label></div><label class="qw-field" id="sched-weekday" ${t.frequency==='weekly'?'':'hidden'}><span>星期</span><select data-sched-time="weekday">${['日','一','二','三','四','五','六'].map((d,i)=>`<option value="${i}" ${t.weekday===i?'selected':''}>星期${d}</option>`).join('')}</select></label><label class="qw-field"><span>时区</span><select data-sched-time="timezone"><option ${t.timezone==='Asia/Shanghai'?'selected':''}>Asia/Shanghai</option><option ${t.timezone==='UTC'?'selected':''}>UTC</option></select></label><h3>清理范围</h3><label class="qw-field"><span>任务保留天数</span><input type="number" min="1" max="365" required data-sched-retention value="${s.task.retentionDays}"></label><p class="qw-muted">例如填写 30：每天检查并清理最后更新时间超过 30 天的可清理任务。</p>`;}
    function scheduleForm(){const s=schedulerUi.draft,t=s.timing,task=s.task,c=task.config;return `<div class="qw-tip">保存后统一在“定时任务”管理。暂停只影响后续调度；错过时间点不补跑。</div><label class="qw-field"><span>任务名称</span><input required maxlength="100" data-sched-field="name" value="${escapeHtml(s.name)}"></label><label class="qw-field"><span>所属工具</span><select id="sched-tool" ${schedulerUi.editing?'disabled':''}><option value="quality" ${task.kind==='quality'?'selected':''}>质量检查</option><option value="auto-ut" ${task.kind==='auto-ut'?'selected':''}>UT 治理</option>${task.kind==='csv'?'<option value="csv" selected>UT 治理 · 原 CSV</option>':''}</select></label><label class="qw-checks"><input type="checkbox" data-sched-field="enabled" ${s.enabled?'checked':''}>启用计划</label><h3>何时执行</h3><div class="qw-two"><label class="qw-field"><span>频率</span><select data-sched-time="frequency">${[['daily','每天'],['weekdays','工作日'],['weekly','每周']].map(([v,n])=>`<option value="${v}" ${t.frequency===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="qw-field"><span>时间</span><input required type="time" data-sched-time="time" value="${t.time}"></label></div><label class="qw-field" id="sched-weekday" ${t.frequency==='weekly'?'':'hidden'}><span>星期</span><select data-sched-time="weekday">${['日','一','二','三','四','五','六'].map((d,i)=>`<option value="${i}" ${t.weekday===i?'selected':''}>星期${d}</option>`).join('')}</select></label><label class="qw-field"><span>时区</span><select data-sched-time="timezone"><option ${t.timezone==='Asia/Shanghai'?'selected':''}>Asia/Shanghai</option><option ${t.timezone==='UTC'?'selected':''}>UTC</option></select></label><h3>执行范围</h3>${task.kind==='quality'?`<label class="qw-field"><span>版本（逗号分隔）</span><input required data-sched-quality="versions" value="${escapeHtml(task.query.versions.join(', '))}"></label><label class="qw-field"><span>PL 团队（逗号分隔）</span><input required data-sched-quality="teams" value="${escapeHtml(task.query.teams.join(', '))}"></label><label class="qw-field"><span>业务域</span><input required data-sched-quality="domain" value="${escapeHtml(task.query.domain)}"></label><div class="qw-checks">${Object.entries(qwNames).map(([k,n])=>`<label><input type="checkbox" data-sched-kind="${k}" ${task.query.kinds.includes(k)?'checked':''}>${n}</label>`).join('')}</div><p class="qw-muted">静态检查读取执行时的当前快照。</p>`:task.kind==='auto-ut'?`<div id="sched-versions">${c.versions.map((v,i)=>`<div class="qw-mapping"><div class="qw-two"><label class="qw-field"><span>版本</span><input required data-sched-version="${i}" value="${escapeHtml(v.version)}"></label><label class="qw-field"><span>基础分支</span><input data-sched-branch="${i}" value="${escapeHtml(v.baseBranch)}"></label></div><label class="qw-field"><span>本版本问题单</span><input data-sched-ticket="${i}" value="${escapeHtml(reportVersionTicket(c,v.version)||'')}"></label><button type="button" class="qw-link" data-sched-remove="${i}" ${c.versions.length===1?'disabled':''}>移除</button></div>`).join('')}</div><button type="button" class="button" data-sched-add ${c.versions.length>=10?'disabled':''}>＋ 添加版本</button><label class="qw-field" style="margin-top:14px"><span>执行方式</span><select id="sched-action"><option value="FETCH" ${c.schedule.action==='FETCH'?'selected':''}>仅获取 UT 报告</option><option value="REPAIR" ${c.schedule.action==='REPAIR'?'selected':''}>获取后自动治理并创建 MR</option></select></label><div class="qw-two">${[['username','用户名']].map(([k,n])=>`<label class="qw-field"><span>${n}</span><input data-sched-config="${k}" value="${escapeHtml(c[k])}"></label>`).join('')}</div><label class="qw-field"><span>工作目录（后端所在机器）</span><input data-sched-config="workspaceRoot" value="${escapeHtml(c.workspaceRoot)}"></label><label class="qw-field"><span>每仓库每次最多补充类数</span><input type="number" min="1" max="20" data-sched-config="maxClasses" value="${c.maxClasses??5}"></label><p class="qw-muted" style="margin-top:15px">执行时自动获取每个版本的最新 UT 报告；先核验 UT，按需修复或补测试。</p>`:`<p>来源：${escapeHtml(task.reportFileName)}</p><p class="qw-muted">原 CSV 已迁入统一调度；此计划使用已保存的 CSV，不获取新报告。</p>`}${task.kind==='quality'?`<label class="qw-field" style="margin-top:15px"><span>UT / APITest 报告日期</span><select id="sched-date"><option value="yesterday" ${task.dateMode==='yesterday'?'selected':''}>执行前一天</option><option value="today" ${task.dateMode==='today'?'selected':''}>执行当天</option></select></label>`:''}`;}
    async function saveManagedSchedule(){const s=schedulerUi.draft;if(s.task.kind==='auto-ut-cleanup'){s.task.retentionDays=Number(s.task.retentionDays);if(!Number.isInteger(s.task.retentionDays)||s.task.retentionDays<1||s.task.retentionDays>365)throw Error('任务保留天数必须是 1 至 365 的整数');}else{const versions=s.task.kind==='quality'?s.task.query.versions:s.task.kind==='auto-ut'?s.task.config.versions.map(v=>v.version):[];if(s.task.kind!=='csv'&&(!versions.length||versions.length>10||versions.some(v=>!/^R\d{2}C\d{2}$/i.test(v))||new Set(versions.map(v=>v.toUpperCase())).size!==versions.length))throw Error('请填写 1 至 10 个不重复的版本，例如 R27C10、R27C00');if(s.task.kind==='quality'&&!s.task.query.kinds.length)throw Error('至少选择一种检查类型');if(s.task.kind==='auto-ut'&&s.task.config.schedule.action==='REPAIR'){const c=s.task.config;if(!c.username||!c.workspaceRoot||c.versions.some(v=>!v.baseBranch||!reportVersionTicket(c,v.version))||new Set(c.versions.map(v=>reportVersionTicket(c,v.version))).size!==c.versions.length)throw Error('自动修复需填写用户名、单号、工作目录和每个版本的基础分支');}}await autoUtCall('/api/automation/schedules'+(schedulerUi.editing?'/'+schedulerUi.editing:''),jsonOptions(schedulerUi.editing?'PUT':'POST',s));await loadSchedules();}
    async function scheduleOperation(id,operation){const s=schedulerUi.items.find(x=>x.id===id);if(!s||schedulerUi.busy)return;schedulerUi.busy=true;render(false);try{if(operation==='toggle')await autoUtCall('/api/automation/schedules/'+id,jsonOptions('PATCH',{enabled:!s.enabled,revision:s.revision}));if(operation==='run')await autoUtCall('/api/automation/schedules/'+id+'/runs',{method:'POST'});if(operation==='delete')await autoUtCall('/api/automation/schedules/'+id,jsonOptions('DELETE',{revision:s.revision}));await loadSchedules();showToast(operation==='run'?'执行已创建，请查看记录':operation==='delete'?'计划已删除':'计划状态已更新');}catch(e){showToast(e.message);}finally{schedulerUi.busy=false;render(false);}}
